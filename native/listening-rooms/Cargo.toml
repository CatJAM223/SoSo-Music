[package]
name = "soso-rooms"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
if-addrs = "0.13"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots", "url"] }
url = "2"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[profile.release]
lto = true
strip = true

