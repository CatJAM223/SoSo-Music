name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate version tag
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") {
            throw 'The tag must match the version in package.json.'
          }
      - name: Prepare Rust target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
      - run: npm run test:production
      - run: npm run package:zip
      - run: npm run package:7z
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-diagnostics
          path: |
            scratch/*.json
            scratch/check-logs/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: SoSo-Music-windows-x64
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.7z
            release/*.7z.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(Get-ChildItem -Path release/*.zip,release/*.zip.sha256,release/*.7z,release/*.7z.sha256 -File | ForEach-Object { $_.FullName })
          $releaseNotes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (!(Test-Path -LiteralPath $releaseNotes)) {
            throw "Release notes are missing: $releaseNotes"
          }
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --notes-file $releaseNotes --title "SoSo Music $env:GITHUB_REF_NAME"
