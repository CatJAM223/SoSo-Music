name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate version tag
        shell: pwsh
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$releaseVersion") {
            throw 'The tag must match the version in package.json.'
          }
      - name: Prepare Rust target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
      - run: npm run test:production
      - run: npm run package:zip
      - run: npm run package:7z
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-diagnostics
          path: |
            scratch/*.json
            scratch/check-logs/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: SoSo-Music-windows-x64
          path: |
            release/*.zip
            release/*.zip.sha256
            release/*.7z
            release/*.7z.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  linux:
    uses: ./.github/workflows/linux.yml

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: SoSo-Music-*-x64
          path: release
          merge-multiple: true
      - name: Publish tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes"
          assets=()
          for suffix in windows-x64.zip windows-x64.7z linux-amd64.deb linux-x86_64.AppImage; do
            file="SoSo-Music-$version-$suffix"
            test -f "release/$file"
            (cd release && sha256sum --strict --check -- "$file.sha256")
            assets+=("release/$file" "release/$file.sha256")
          done
          if gh release view "$GITHUB_REF_NAME" --json url >/dev/null 2>&1; then
            echo 'Release already exists; preserving its verified assets.'
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --notes-file "$notes" --title "SoSo Music $GITHUB_REF_NAME"
