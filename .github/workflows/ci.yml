name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'public/**'
      - 'icon/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.mts'
      - 'index.html'
      - '.prettierignore'
      - '.gitattributes'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/**'
      - 'public/**'
      - 'icon/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - '*.mts'
      - 'index.html'
      - '.prettierignore'
      - '.gitattributes'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Prepare Rust target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run test:all
      - run: npm run build:renderer
      - run: npm run test:production
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: |
            scratch/*.json
            scratch/check-logs/**
          if-no-files-found: ignore
          retention-days: 7
