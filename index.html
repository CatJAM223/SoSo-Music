<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob: https: media:; img-src 'self' data: https: blob: media:; frame-src 'self' https:; connect-src 'self' media: https: data: blob: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <meta name="theme-color" content="#121212" />
    <title>SoSo Music</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- DNS prefetch & preconnect for audio & artwork CDNs -->
    <link rel="dns-prefetch" href="https://api-v2.soundcloud.com" />
    <link rel="dns-prefetch" href="https://cf-media.sndcdn.com" />
    <link rel="dns-prefetch" href="https://i1.sndcdn.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://lrclib.net" />
    <link rel="preconnect" href="https://i1.sndcdn.com" crossorigin />
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <link href="/startup.css" rel="stylesheet" />
    <script src="/theme-init.js"></script>
  </head>
  <body
    class="font-sans antialiased overflow-hidden select-none bg-[#f8fafc] dark:bg-[#121212] text-slate-900 dark:text-slate-100"
  >
    <div id="root"></div>
    <div id="app-preloader" role="status" aria-label="Загрузка">
      <div class="startup-mark">
        <div class="startup-glow"></div>
        <div class="startup-ring"></div>
        <img src="/icon.png" alt="" width="48" height="48" draggable="false" />
      </div>
      <p>Загрузка…</p>
    </div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
